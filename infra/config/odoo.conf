[options]
; Replace with the generated PBKDF2 hash (see docs, section 2).
admin_passwd = REPLACE_WITH_PBKDF2_HASH
dbfilter = ^universia_prod$
; True ONLY while creating the database; then set back to False.
list_db = True
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
; workers = 0 (threaded mode): the POS websocket works on port 8069 without a proxy.
workers = 0
max_cron_threads = 1
limit_time_cpu = 120
limit_time_real = 240
log_level = info
proxy_mode = False
